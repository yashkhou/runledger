<g class="l0"><text x="32" y="70" class="p">$</text><text x="50" y="70" class="c">npx runledger add tool.call &#x27;{&quot;name&quot;:&quot;browser.click&quot;,&quot;target&quot;:&quot;#checkout&quot;}&#x27;</text></g><g class="l1"><text x="32" y="97" class="o">ed088a93180a5a6dd7e42465d7ccead5…</text></g><g class="l2"><text x="32" y="124" class="p">$</text><text x="50" y="124" class="c">npx runledger add tool.result &#x27;{&quot;url&quot;:&quot;/checkout/error&quot;}&#x27;</text></g><g class="l3"><text x="32" y="151" class="o">c39e48d5c789cd63dfeb50b24a37260e…</text></g><g class="l4"><text x="32" y="178" class="p">$</text><text x="50" y="178" class="c">npx runledger add claim &#x27;{&quot;agent&quot;:&quot;order placed&quot;}&#x27;</text></g><g class="l5"><text x="32" y="205" class="o">e8aefbb1019c7dd59d38c01c1b28224b…</text></g><g class="l6"><text x="32" y="232" class="p">$</text><text x="50" y="232" class="c">npx runledger verify</text></g><g class="l7"><rect x="30" y="242" width="95.6" height="24" rx="12" fill="#23a36b" opacity=".12"/><text x="41" y="259" class="g">VERIFIED</text></g><g class="l8"><text x="32" y="286" class="n"># now make the run look better than it was…</text></g><g class="l9"><text x="32" y="313" class="p">$</text><text x="50" y="313" class="c">sed -i &#x27;s#/checkout/error#/checkout/success#&#x27; runledger.jsonl</text></g><g class="l10"><text x="32" y="340" class="p">$</text><text x="50" y="340" class="c">npx runledger verify</text></g><g class="l11"><rect x="30" y="350" width="279.59999999999997" height="24" rx="12" fill="#d64045" opacity=".12"/><text x="41" y="367" class="r">BROKEN at event 1   (exit 1)</text></g>
